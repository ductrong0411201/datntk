<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trung tâm dạy thêm Thế Kiên</title>
    <script src="https://cdn.cloud.pspdfkit.com/pspdfkit-web@1.10.0/nutrient-viewer.js"></script>
    <style>
      .nutrient-viewer-container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      }
      
      .nutrient-viewer-container canvas {
        font-smooth: always;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .pspdfkit-container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      }
      
      .pspdfkit-container canvas {
        font-smooth: always;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      [data-pspdfkit-container] {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      }
      
      [data-pspdfkit-container] canvas {
        font-smooth: always;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .pspdfkit-watermark,
      .pspdfkit-watermark-overlay,
      [class*="watermark"],
      [class*="evaluation"],
      [id*="watermark"],
      [id*="evaluation"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
      
      .nutrient-viewer-container [class*="watermark"],
      .nutrient-viewer-container [class*="evaluation"],
      .nutrient-viewer-container [id*="watermark"],
      .nutrient-viewer-container [id*="evaluation"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
      
      .pspdfkit-container [class*="watermark"],
      .pspdfkit-container [class*="evaluation"],
      .pspdfkit-container [id*="watermark"],
      .pspdfkit-container [id*="evaluation"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
